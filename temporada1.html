<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Am Frankie - Temporada 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" style="text-decoration: none; color: inherit;"><h1>I Am Frankie</h1></a>
    </header>

    <main>
        <section class="seasons">
            <div class="season-title">
                <h2>Temporada 1</h2>
            </div>
            <div id="episode-list-season1" class="episode-list">
                <!-- Los episodios se generarán dinámicamente aquí -->
            </div>
        </section>
    </main>

    <footer>
        <p>Todos los videos siguientes o vienen de Iam Frankie online</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const season1List = document.getElementById('episode-list-season1');
            const episodesS1 = Array.from({ length: 20 }, (_, i) => `Episodio ${i + 1}`);

            function generateEpisodeCards(seasonNumber, episodeTitles, container) {
                container.innerHTML = ''; // Limpiar la lista
                episodeTitles.forEach((title, index) => {
                    const episodeNumber = index + 1;
                    const card = document.createElement('div');
                    card.className = 'episode-card';
                    card.innerHTML = `
                        <div class="episode-thumbnail">
                            <img src="temporada${seasonNumber}-episodio${episodeNumber}.jpg" alt="${title}" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                        <div class="episode-title">${title}</div>
                    `;
                    container.appendChild(card);
                });
            }

            generateEpisodeCards(1, episodesS1, season1List);
        });
    </script>
</body>
</html>
